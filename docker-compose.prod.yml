services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rivalens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-rivalens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rivalens} -d ${POSTGRES_DB:-rivalens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: postgres is reachable only from the compose network.

  backend:
    build:
      context: ./backend
    restart: always
    command: sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: nginx proxies to backend:8000.

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://rivalens.ru}
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - backend
    # No ports: nginx proxies to frontend:3000.

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot-www:/var/www/certbot
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
