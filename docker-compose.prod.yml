services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rivalens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-rivalens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rivalens} -d ${POSTGRES_DB:-rivalens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: postgres is reachable only from the compose network.

  backend:
    build:
      context: ./backend
    restart: always
    command: sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env.prod
    environment:
      # Email notifications (explicit defaults keep the backend runnable
      # when .env.prod predates these keys).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@rivalens.ru}
      SMTP_TLS: ${SMTP_TLS:-true}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    # Only the host nginx (running outside Docker) reaches the backend.

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://rivalens.ru}
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"
    # Only the host nginx (running outside Docker) reaches the frontend.

# All three services share the default compose network; no nginx container
# here — ports 80/443 on the VPS are owned by the host nginx, which proxies
# /api/ -> 127.0.0.1:8001 and / -> 127.0.0.1:3001 (deploy/rivalens.ru.nginx.conf).

volumes:
  postgres_data:
