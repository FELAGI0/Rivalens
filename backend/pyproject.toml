[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalens"
version = "0.1.0"
description = "Rivalens backend — competitor website monitoring with AI summarization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openai>=1.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.8",
    "respx>=0.21",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", "*.egg-info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
