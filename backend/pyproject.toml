[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalens"
version = "0.1.0"
description = "Rivalens backend — competitor website monitoring with AI summarization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", "*.egg-info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
