# Config for the HOST nginx (not a container), /etc/nginx/sites-available/rivalens.ru
# Ports 80/443 on this VPS are already owned by the host nginx serving
# another project; Rivalens is proxied through it.

server {
    listen 80;
    server_name rivalens.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rivalens.ru;

    # certbot --nginx fills these in automatically when it issues the
    # certificate (see deploy/README.md, step 7).
    # ssl_certificate /etc/letsencrypt/live/rivalens.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rivalens.ru/privkey.pem;

    client_max_body_size 10m;

    # /health lives on the backend root (not under /api/), so it needs an
    # exact-match location BEFORE location / — otherwise it hits Next.js
    # and returns a 404 HTML page.
    location = /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
