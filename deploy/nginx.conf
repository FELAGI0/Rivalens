upstream backend {
  server backend:8000;
}

upstream frontend {
  server frontend:3000;
}

# HTTP: redirect everything to https except ACME challenges for certbot.
server {
  listen 80;
  server_name rivalens.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: uncomment after the certificate is issued (step 7 of deploy/README.md),
# then restart nginx:
#   docker compose -f docker-compose.prod.yml restart nginx
server {
  listen 443 ssl;
  server_name rivalens.ru;

  ssl_certificate /etc/letsencrypt/live/rivalens.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rivalens.ru/privkey.pem;

  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
